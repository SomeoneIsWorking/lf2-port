<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151821">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Little Fighter 2</title>
<main id="setup">
  <p class="eyebrow">Native browser port</p>
  <h1>Little Fighter 2</h1>
  <p>Use your own LF2 v2.0a installation. Choose a ZIP containing <code>lf2.exe</code> and its complete data tree.</p>
  <p>Your files stay in this browser's private storage and are never uploaded.</p>
  <div class="actions">
    <label class="button">Choose game ZIP<input id="archive" type="file" accept=".zip,application/zip" disabled></label>
    <button id="play" disabled>Play saved installation</button>
  </div>
  <p id="status" role="status" aria-live="polite">Preparing browser storage…</p>
  <progress id="progress" hidden></progress>
  <p id="storage-note"></p>
  <button id="reload" hidden>Return to setup</button>
</main>
<canvas id="canvas" tabindex="0" aria-label="Little Fighter 2 game"></canvas>
<script type="module" src="app.mjs"></script>
</html>
