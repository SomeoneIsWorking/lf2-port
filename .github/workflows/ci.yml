name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Linux x86-64 has a real native/JIT product build boundary. macOS ARM64 and
# Android remain blocked on the missing x86port ARM64 JIT backend; Windows is
# not a shipping target. Those gaps are recorded in docs/project-state.md.
jobs:
  linux-x64:
    name: Linux x86-64 native/JIT product
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      CMAKE_GENERATOR: Ninja
      PORT_ASSETS_DIR: ${{ github.workspace }}/build/deps/port-assets
    steps:
      - name: Check out full history and exact source submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Check out exact shared device assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SomeoneIsWorking/port-assets
          ref: 330c1bf146bd97ecc6af49e637476a677f0e55a0
          path: build/deps/port-assets
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.10.12'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang clang-format clang-tidy cmake ninja-build pkg-config \
            libbz2-dev libfreetype-dev libsdl3-dev libsdl3-image-dev \
            libsdl3-ttf-dev zlib1g-dev
      - name: Verify complete checkout histories
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git -C third_party/RmlUi rev-parse --is-shallow-repository)" = false
          test "$(git -C third_party/lucent rev-parse --is-shallow-repository)" = false
          test "$(git -C build/deps/port-assets rev-parse --is-shallow-repository)" = false
      - name: Build the real native/JIT product boundary
        run: uv run --frozen python tools/build/build.py --build-dir build/ci
      - name: Confirm the native Linux toolchain and Ninja generator
        run: |
          grep -q 'set(CMAKE_C_COMPILER_ID "Clang")' build/ci/CMakeFiles/*/CMakeCCompiler.cmake
          grep -q 'set(CMAKE_CXX_COMPILER_ID "Clang")' build/ci/CMakeFiles/*/CMakeCXXCompiler.cmake
          grep -q '^CMAKE_GENERATOR:INTERNAL=Ninja$' build/ci/CMakeCache.txt
      - name: Run native/JIT boundary and quality tests
        run: >-
          ctest --test-dir build/ci --output-on-failure
          --tests-regex
          '^(game_data|execution_boundary|source_policy|product_execution_symbols|structure|clang_format|clang_tidy|build_toolchain|source_dependencies|game_selection)$'
